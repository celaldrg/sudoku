<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoku</title>
  <meta name="description" content="A clean, mobile-friendly Sudoku with unique-solution puzzles in three difficulties, pencil notes, hints, undo and auto-save. Plays offline in any browser.">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sudoku">
  <meta property="og:description" content="Unique-solution Sudoku puzzles with notes, hints and undo. Free and open source.">
  <meta property="og:url" content="https://celaldrg.github.io/sudoku/">
  <meta property="og:image" content="https://celaldrg.github.io/sudoku/docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%2314b8a6'/%3E%3Cpath d='M11.3 6v20M20.7 6v20M6 11.3h20M6 20.7h20' stroke='%230f172a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#14b8a6"/><path d="M11.3 6v20M20.7 6v20M6 11.3h20M6 20.7h20" stroke="#0f172a" stroke-width="2"/></svg>
      <span>Sudoku</span>
    </h1>
    <div class="topbar-actions">
      <button id="new-game" class="btn btn-primary" type="button">
        <svg class="icon icon-new" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="newGame">New game</span>
      </button>
      <button id="restart" class="btn btn-restart" type="button" data-i18n-label="restart" aria-label="Restart">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg>
        <span class="wide-only" data-i18n="restart">Restart</span>
      </button>
      <button id="lang" class="btn btn-lang" type="button" aria-label="Switch to Turkish">TR</button>
    </div>
  </header>

  <main class="game">
    <div class="status">
      <label class="field">
        <span data-i18n="difficulty">Difficulty</span>
        <select id="difficulty">
          <option value="easy" data-i18n="easy">Easy</option>
          <option value="medium" data-i18n="medium" selected>Medium</option>
          <option value="hard" data-i18n="hard">Hard</option>
        </select>
      </label>
      <div class="timer" role="timer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>
        <span class="sr-only" data-i18n="time">Time</span>
        <span id="time">0:00</span>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="group" data-i18n-label="board" aria-label="Sudoku board"></div>
    </div>

    <div class="actions" role="toolbar" data-i18n-label="actions" aria-label="Game actions">
      <button id="undo" class="tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span data-i18n="undo">Undo</span>
      </button>
      <button id="erase" class="tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7M5 11l9 9"/></svg>
        <span data-i18n="erase">Erase</span>
      </button>
      <button id="notes" class="tool" type="button" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span data-i18n="notes">Notes</span>
      </button>
      <button id="hint" class="tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>
        <span data-i18n="hint">Hint</span>
        <span id="hints-left" class="badge" aria-hidden="true">3</span>
      </button>
      <button id="check" class="tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span data-i18n="check">Check</span>
      </button>
    </div>

    <div id="pad" class="pad" role="group" data-i18n-label="numberPad" aria-label="Number pad"></div>

    <p class="keys-help" data-i18n="keysHelp">Arrows move · 1–9 enter · 0 / Del erase · N notes · Ctrl+Z undo</p>
  </main>

  <footer class="footer">
    MIT · <a href="https://github.com/celaldrg/sudoku" data-i18n="sourceLink">Source on GitHub</a>
  </footer>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <p id="confirm-text" class="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" value="yes" data-i18n="yes">Yes</button>
      </div>
    </form>
  </dialog>

  <dialog id="win-dialog" class="dialog dialog-win">
    <form method="dialog">
      <svg class="win-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="m15 24.5 6 6 12-13"/></svg>
      <h2 data-i18n="winTitle">Solved!</h2>
      <p class="dialog-text" data-i18n="winText">Every row, column and box is complete.</p>
      <dl class="stats">
        <div><dt data-i18n="time">Time</dt><dd id="win-time">0:00</dd></div>
        <div><dt data-i18n="difficulty">Difficulty</dt><dd id="win-difficulty"></dd></div>
        <div><dt data-i18n="hintsUsed">Hints used</dt><dd id="win-hints">0</dd></div>
      </dl>
      <div class="dialog-actions">
        <button class="btn" value="close" data-i18n="close">Close</button>
        <button class="btn btn-primary" value="new" data-i18n="newGame">New game</button>
      </div>
    </form>
  </dialog>
</body>
</html>
